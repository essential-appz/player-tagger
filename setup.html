<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2196F3">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Set Up Game - Player Tagger</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192x192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .header {
            position: relative;
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            padding: 16px 60px;
            text-align: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .back-btn {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .content {
            max-width: 600px;
            margin: 0 auto;
            padding: 18px 16px;
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .section h2 {
            font-size: 11px;
            font-weight: 700;
            color: #2196F3;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .mode-option {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 10px;
            cursor: pointer;
            text-align: center;
            transition: border-color 0.2s, background 0.2s;
        }

        .mode-option.active {
            border-color: #2196F3;
            background: #e3f2fd;
        }

        .mode-title {
            font-weight: 700;
            font-size: 14px;
            color: #333;
        }

        .mode-desc {
            font-size: 11px;
            color: #888;
            margin-top: 3px;
        }

        .form-group {
            margin-bottom: 13px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 6px;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

        .form-group input[type="text"]:focus {
            border-color: #2196F3;
        }

        .game-name-display {
            background: #e3f2fd;
            border-radius: 7px;
            padding: 10px 12px;
            font-size: 13px;
            color: #1565C0;
            font-weight: 500;
            margin-top: 12px;
        }

        .descriptors-list {
            border: 1px solid #e8e8e8;
            border-radius: 7px;
            min-height: 56px;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 10px;
            background: #fafafa;
        }

        .descriptor-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }

        .descriptor-item:last-child {
            border-bottom: none;
        }

        .delete-desc-btn {
            background: none;
            color: #e53935;
            border: none;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .delete-desc-btn:hover {
            background: #ffebee;
        }

        .add-descriptor-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .add-descriptor-row input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }

        .add-descriptor-row input:focus {
            border-color: #2196F3;
        }

        .add-btn {
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .reset-btn {
            background: none;
            color: #999;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
        }

        .saved-games-list {
            border: 1px solid #e8e8e8;
            border-radius: 7px;
            overflow: hidden;
        }

        .no-saves {
            padding: 16px;
            text-align: center;
            color: #bbb;
            font-size: 13px;
        }

        .saved-game-item {
            padding: 11px 12px;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .saved-game-item:last-child {
            border-bottom: none;
        }

        .saved-game-info {
            flex: 1;
            min-width: 0;
        }

        .saved-game-info strong {
            display: block;
            font-size: 13px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .saved-game-info span {
            font-size: 11px;
            color: #aaa;
        }

        .load-save-btn {
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .start-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2196F3 0%, #1565C0 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(33,150,243,0.35);
            font-family: inherit;
        }

        .start-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="home.html" class="back-btn">← Home</a>
        <h1>Set Up Game</h1>
    </div>

    <div class="content">

        <!-- Game Mode -->
        <div class="section">
            <h2>Game Mode</h2>
            <div class="mode-selector">
                <div class="mode-option active" id="inMatchMode" onclick="setMode('in-match')">
                    <div class="mode-title">In-Match</div>
                    <div class="mode-desc">Track events during live game</div>
                </div>
                <div class="mode-option" id="postMatchMode" onclick="setMode('post-match')">
                    <div class="mode-title">Post-Match</div>
                    <div class="mode-desc">Analyse after the game</div>
                </div>
            </div>
        </div>

        <!-- Teams -->
        <div class="section">
            <h2>Teams</h2>
            <div class="form-group">
                <label>Our Team</label>
                <input type="text" id="team1Name" placeholder="e.g. Kerry" oninput="updateGameName()">
            </div>
            <div class="form-group">
                <label>Opposition</label>
                <input type="text" id="team2Name" placeholder="e.g. Dublin" oninput="updateGameName()">
            </div>
            <div class="game-name-display" id="gameNameDisplay">Enter team names above</div>
        </div>

        <!-- Event Descriptors -->
        <div class="section">
            <h2>Event Descriptors</h2>
            <div class="descriptors-list" id="descriptorsList"></div>
            <div class="add-descriptor-row">
                <input type="text" id="newDescriptorInput" placeholder="New descriptor name" maxlength="20"
                    onkeypress="if(event.key==='Enter')addDescriptor()">
                <button class="add-btn" onclick="addDescriptor()">Add</button>
            </div>
            <button class="reset-btn" onclick="resetDescriptors()">Reset to Defaults</button>
        </div>

        <!-- Saved Games -->
        <div class="section">
            <h2>Load a Saved Game</h2>
            <div id="savedGamesList" class="saved-games-list"></div>
        </div>

        <!-- Start -->
        <button class="start-btn" onclick="startGame()">Start New Game</button>

    </div>

    <script>
        const defaultDescriptors = ['Goal', '2 Pointer', 'Point', 'For 45', 'Wide', 'Save/Shot',
            'Own KO Won', 'Own KO Lost', 'Our T/O Lost', 'Opp KO Won', 'Opp KO Lost', 'Opp T/O Lost'];

        let descriptors = [];
        let gameMode = 'in-match';

        function init() {
            gameMode = localStorage.getItem('gameMode') || 'in-match';
            updateModeUI();

            const saved = localStorage.getItem('customDescriptors');
            descriptors = saved ? JSON.parse(saved) : [...defaultDescriptors];
            renderDescriptors();

            renderSavedGames();
        }

        function setMode(mode) {
            gameMode = mode;
            updateModeUI();
        }

        function updateModeUI() {
            document.getElementById('inMatchMode').classList.toggle('active', gameMode === 'in-match');
            document.getElementById('postMatchMode').classList.toggle('active', gameMode === 'post-match');
        }

        function updateGameName() {
            const t1 = document.getElementById('team1Name').value || 'Us';
            const t2 = document.getElementById('team2Name').value || 'Opposition';
            const d = new Date();
            const dateStr = String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
            document.getElementById('gameNameDisplay').textContent = t1 + ' v ' + t2 + ' — ' + dateStr;
        }

        function renderDescriptors() {
            const list = document.getElementById('descriptorsList');
            if (descriptors.length === 0) {
                list.innerHTML = '<div style="padding:12px;text-align:center;color:#bbb;font-size:13px;">No descriptors added</div>';
                return;
            }
            list.innerHTML = descriptors.map(d => `
                <div class="descriptor-item">
                    <span>${d}</span>
                    <button class="delete-desc-btn" onclick="deleteDescriptor(${JSON.stringify(d)})">Remove</button>
                </div>
            `).join('');
        }

        function addDescriptor() {
            const input = document.getElementById('newDescriptorInput');
            const val = input.value.trim();
            if (!val) return;
            if (val === 'Touch') { alert('"Touch" is a reserved descriptor and cannot be added.'); return; }
            if (descriptors.includes(val)) { alert('This descriptor already exists.'); return; }
            descriptors.push(val);
            input.value = '';
            renderDescriptors();
        }

        function deleteDescriptor(desc) {
            if (!confirm('Delete "' + desc + '"?')) return;
            descriptors = descriptors.filter(d => d !== desc);
            renderDescriptors();
        }

        function resetDescriptors() {
            if (!confirm('Reset to default descriptors? Custom descriptors will be removed.')) return;
            descriptors = [...defaultDescriptors];
            renderDescriptors();
        }

        function renderSavedGames() {
            const saves = JSON.parse(localStorage.getItem('gameSaves') || '[]');
            const list = document.getElementById('savedGamesList');

            if (saves.length === 0) {
                list.innerHTML = '<div class="no-saves">No saved games</div>';
                return;
            }

            list.innerHTML = saves.map((save, index) => {
                const date = new Date(save.timestamp);
                const saveType = save.isFinalGame ? 'full game' : 'in-progress';
                return `
                    <div class="saved-game-item">
                        <div class="saved-game-info">
                            <strong>${save.gameName || 'Game'}</strong>
                            <span>[${saveType}] &nbsp;${date.toLocaleString()} &nbsp;(${save.eventCount} events)</span>
                        </div>
                        <button class="load-save-btn" onclick="loadSave(${index})">Load</button>
                    </div>
                `;
            }).join('');
        }

        function loadSave(index) {
            const saves = JSON.parse(localStorage.getItem('gameSaves') || '[]');
            const save = saves[index];
            if (!save) return;
            if (!confirm('Load "' + (save.gameName || 'Game') + '"?\n\nThis will replace any current game data in the tagger.')) return;

            // Write events directly so player-app loads them
            localStorage.setItem('categoryEvents', JSON.stringify(save.events || []));

            // Pass team info to player-app
            localStorage.setItem('pendingTeamSetup', JSON.stringify({
                team1Name: save.team1Name || 'Us',
                team2Name: save.team2Name || 'Opposition',
                gameName: save.gameName || '',
                mode: gameMode
            }));

            window.location.href = 'player-app.html';
        }

        function startGame() {
            const t1 = document.getElementById('team1Name').value.trim() || 'Us';
            const t2 = document.getElementById('team2Name').value.trim() || 'Opposition';

            // Persist settings
            localStorage.setItem('gameMode', gameMode);
            localStorage.setItem('customDescriptors', JSON.stringify(descriptors));
            // Clear any existing game events
            localStorage.setItem('categoryEvents', JSON.stringify([]));

            // Pass team names and game info to player-app
            const d = new Date();
            const dateStr = String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
            localStorage.setItem('pendingTeamSetup', JSON.stringify({
                team1Name: t1,
                team2Name: t2,
                gameName: t1 + ' v ' + t2 + ' — ' + dateStr,
                mode: gameMode
            }));

            window.location.href = 'player-app.html';
        }

        init();
    </script>
</body>
</html>
