<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2196F3">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Player Tagger</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192x192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            padding: 28px 20px 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.85;
            margin-top: 5px;
        }

        .tiles-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 20px;
            flex: 1;
        }

        .tile {
            background: white;
            border-radius: 14px;
            padding: 26px 14px 22px;
            text-align: center;
            text-decoration: none;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            border: 2px solid transparent;
            transition: border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 150px;
        }

        .tile:hover {
            border-color: #2196F3;
            box-shadow: 0 4px 18px rgba(33,150,243,0.18);
        }

        .tile:active {
            transform: scale(0.97);
        }

        .tile-icon {
            font-size: 42px;
            line-height: 1;
        }

        .tile-title {
            font-size: 15px;
            font-weight: 700;
            color: #1565C0;
            line-height: 1.2;
        }

        .tile-desc {
            font-size: 12px;
            color: #888;
            line-height: 1.4;
        }

        .footer {
            text-align: center;
            padding: 16px;
            font-size: 11px;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Player Tagger</h1>
        <p>GAA Match Analysis</p>
    </div>

    <div class="tiles-grid">
        <a href="setup.html" class="tile">
            <div class="tile-icon">&#9881;&#65039;</div>
            <div class="tile-title">Set up my game</div>
            <div class="tile-desc">Configure teams, mode &amp; descriptors</div>
        </a>

        <a href="player-app.html" class="tile">
            <div class="tile-icon">&#127991;</div>
            <div class="tile-title">Tag my game</div>
            <div class="tile-desc">Track events during a live match</div>
        </a>

        <a href="reports.html" class="tile">
            <div class="tile-icon">&#128203;</div>
            <div class="tile-title">Report my game</div>
            <div class="tile-desc">View stats &amp; game summaries</div>
        </a>

        <a href="player-app.html?mode=post-match" class="tile">
            <div class="tile-icon">&#128200;</div>
            <div class="tile-title">Analyse my game</div>
            <div class="tile-desc">Deep dive post-match analysis</div>
        </a>
    </div>

    <div class="footer">Player Tagger</div>
</body>
</html>
